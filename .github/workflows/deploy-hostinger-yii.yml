name: Deploy Yii 2.0 to Hostinger

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy-yii-hostinger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Yii app to Hostinger via FTP
        shell: pwsh
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          HOSTINGER_FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          HOSTINGER_FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          HOSTINGER_REMOTE_DIR: ${{ secrets.HOSTINGER_REMOTE_DIR }}
        run: |
          ./deploy/hostinger/Deploy-Yii2-To-Hostinger.ps1
