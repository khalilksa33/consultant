name: Deploy MERN to VPS

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  OWNER: khalilksa33

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (for ARM cross-compilation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/26i-consult-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/26i-consult-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:5000
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/26i-consult-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/26i-consult-frontend:${{ github.sha }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update docker-compose with new image tags
        run: |
          sed -i 's|ghcr.io/khalilksa33/26i-consult-backend:.*|ghcr.io/khalilksa33/26i-consult-backend:${{ github.sha }}|g' docker-compose.yml
          sed -i 's|ghcr.io/khalilksa33/26i-consult-frontend:.*|ghcr.io/khalilksa33/26i-consult-frontend:${{ github.sha }}|g' docker-compose.yml

      - name: Configure SSH and deploy MERN app via Docker Compose
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
          SSH_HOST_NAME: ${{ secrets.SSH_HOST_NAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Setup SSH (Standard direct connection to OCI public IP)
          cat << EOF > ~/.ssh/config
          Host $SSH_HOST_NAME
            StrictHostKeyChecking no
            User $SSH_USER
          EOF

          # Copy docker-compose and nginx config to VPS
          scp docker-compose.yml $SSH_HOST_NAME:~/docker-compose.yml
          scp -r nginx $SSH_HOST_NAME:~/nginx

          # Run deployment commands on VPS
          ssh $SSH_HOST_NAME << 'ENDSSH'
            # Log in to GHCR to pull private images
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u khalilksa33 --password-stdin || true

            # Stop existing containers if any
            sudo docker compose -f ~/docker-compose.yml down || true

            # Pull latest images
            sudo docker compose -f ~/docker-compose.yml pull

            # Start containers
            sudo docker compose -f ~/docker-compose.yml up -d

            # Wait for backend to be ready, then seed database
            sleep 15
            sudo docker compose -f ~/docker-compose.yml exec -T backend node scripts/seed.js
          ENDSSH
