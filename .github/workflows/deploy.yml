name: Build and Deploy to K8s

on:
  push:
    branches:
      - master

env:
  REGISTRY: ghcr.io
  OWNER: khalilksa33

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/al-diwan-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/al-diwan-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/al-diwan-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/al-diwan-frontend:${{ github.sha }}

  deploy-to-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      - name: Update deployment with new image tags
        run: |
          sed -i 's|ghcr.io/khalilksa33/al-diwan-backend:.*|ghcr.io/khalilksa33/al-diwan-backend:${{ github.sha }}|g' k8s/deployment.yaml
          sed -i 's|ghcr.io/khalilksa33/al-diwan-frontend:.*|ghcr.io/khalilksa33/al-diwan-frontend:${{ github.sha }}|g' k8s/deployment.yaml

      - name: Configure SSH and Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CF_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          SSH_USER: ${{ secrets.SSH_USERNAME }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Setup SSH to use Cloudflare proxy
          cat << EOF > ~/.ssh/config
          Host ssh-cloud.26i.uk
            ProxyCommand cloudflared access ssh --hostname %h --service-token-id $CF_ID --service-token-secret $CF_SECRET
            StrictHostKeyChecking no
            User $SSH_USER
          EOF
          
          # Stream the updated yaml file to kubectl on Host C over SSH
          cat k8s/deployment.yaml | ssh ssh-cloud.26i.uk "kubectl apply -f -"
          
          # Verify rollouts
          ssh ssh-cloud.26i.uk "kubectl rollout status deployment/al-diwan-backend"
          ssh ssh-cloud.26i.uk "kubectl rollout status deployment/al-diwan-frontend"
