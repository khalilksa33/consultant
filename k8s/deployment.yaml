apiVersion: apps/v1
kind: Deployment
metadata:
  name: 26i-consult-backend
  labels:
    app: 26i-consult-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: 26i-consult-backend
  template:
    metadata:
      labels:
        app: 26i-consult-backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/khalilksa33/26i-consult-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        env:
        - name: MONGODB_URI
          value: "mongodb://mongodb:27017/26i-consult"
        - name: JWT_SECRET
          value: "super_secret_jwt_key_26i_consulting_app"
---
apiVersion: v1
kind: Service
metadata:
  name: 26i-consult-backend-service
spec:
  selector:
    app: 26i-consult-backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 26i-consult-frontend
  labels:
    app: 26i-consult-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: 26i-consult-frontend
  template:
    metadata:
      labels:
        app: 26i-consult-frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/khalilksa33/26i-consult-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://26i-consult-backend-service:5000"
---
apiVersion: v1
kind: Service
metadata:
  name: 26i-consult-frontend-service
spec:
  type: LoadBalancer
  selector:
    app: 26i-consult-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000