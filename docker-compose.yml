version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: 26i-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  backend:
    image: ghcr.io/khalilksa33/26i-consult-backend:latest
    container_name: 26i-backend
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/26i-consult
      - JWT_SECRET=change_this_to_a_strong_secret_in_production
    depends_on:
      - mongodb

  frontend:
    image: ghcr.io/khalilksa33/26i-consult-frontend:latest
    container_name: 26i-frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: 26i-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data:
