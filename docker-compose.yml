version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: 26i-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  backend:
    image: ghcr.io/khalilksa33/26i-consult-backend:latest
    container_name: 26i-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/26i-consult
      - JWT_SECRET=fallback_secret # You can override this in production
    depends_on:
      - mongodb

  frontend:
    image: ghcr.io/khalilksa33/26i-consult-frontend:latest
    container_name: 26i-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongodb_data:
