<VirtualHost *:80>
    ServerName admin.example.com
    DocumentRoot /home/username/public_html/admin

    <Directory /home/username/public_html/admin>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/admin_error.log
    CustomLog ${APACHE_LOG_DIR}/admin_access.log combined
</VirtualHost>

# If using HTTPS, add the certificate block and redirect rules as needed.
